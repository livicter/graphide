<!DOCTYPE html>
<html lang="en" class="bright" data-preset="classic">
<head>
  <meta charset="UTF-8" />
  <title>Graphide webview harness</title>
  <link href="../media/main.css" rel="stylesheet" />
  <style>
    :root {
      --vscode-foreground: #1d1d1f;
      --vscode-sideBar-background: #f5f5f7;
      --vscode-editor-background: #ffffff;
      --vscode-panel-border: rgba(60, 60, 67, 0.12);
      --vscode-focusBorder: #007aff;
      --vscode-textLink-foreground: #007aff;
      --vscode-errorForeground: #ff3b30;
      --vscode-font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      --vscode-font-size: 13px;
      --vscode-button-background: #007aff;
      --vscode-button-foreground: #ffffff;
      --vscode-button-hoverBackground: #0066d6;
      --vscode-input-background: rgba(120, 120, 128, 0.12);
      --vscode-input-foreground: #1d1d1f;
      --vscode-input-border: transparent;
      --vscode-descriptionForeground: rgba(60, 60, 67, 0.6);
      --vscode-editorHoverWidget-background: #ffffff;
      --vscode-progressBar-background: #007aff;
      --vscode-list-hoverBackground: rgba(0, 122, 255, 0.08);
      --vscode-editor-selectionBackground: rgba(0, 122, 255, 0.18);
    }
    #probe {
      position: fixed;
      right: 8px;
      bottom: 8px;
      z-index: 40;
      max-width: 360px;
      padding: 8px 10px;
      background: #111;
      border: 1px solid #555;
      font: 11px/1.4 ui-monospace, monospace;
      color: #c6e0ff;
      white-space: pre-wrap;
      pointer-events: none;
    }
    #probe.bad { border-color: #f85149; color: #ffb4b0; }
    #probe.good { border-color: #3fb950; color: #b7f0c0; }
    #probe[hidden] { display: none !important; }
    #suite {
      position: fixed;
      left: 8px;
      top: 8px;
      z-index: 50;
      max-width: 420px;
      max-height: calc(100vh - 16px);
      overflow: auto;
      padding: 8px 10px;
      background: #111;
      border: 1px solid #555;
      font: 11px/1.35 ui-monospace, monospace;
      color: #ddd;
    }
    #suite h2 { margin: 0 0 6px; font-size: 12px; }
    #suite .ok { color: #3fb950; }
    #suite .fail { color: #f85149; }
    #suite .sum { margin-bottom: 6px; }
  </style>
  <script>
    window.acquireVsCodeApi = function () {
      return {
        postMessage: function (m) {
          window.__vscodePosts = window.__vscodePosts || [];
          window.__vscodePosts.push(m);
          console.log("vscode.postMessage", m);
        },
        getState: function () { return null; },
        setState: function () {},
      };
    };
  </script>
</head>
<body class="bright" data-preset="classic">
  <div id="root"></div>
  <div id="probe">waiting for programs message…</div>
  <div id="suite" hidden></div>
  <script src="../media/main.js"></script>
  <script src="./webview-harness.js"></script>
</body>
</html>
