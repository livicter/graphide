name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Workspace tests (includes panic_free)
        run: cargo test --workspace

      - name: Build Graphide CLI
        run: cargo build -p graphide-cli

      - name: Check compiled-in plugins
        run: ./target/debug/graphide plugins --check

      # Shallow Actions checkouts often lack HEAD^; --no-parent still proves
      # derive on this repo. Parent coverage is optional and must not flake.
      - name: Self-review this checkout
        run: |
          set -euo pipefail
          ./target/debug/graphide review --root "$GITHUB_WORKSPACE" --json --progress --no-parent \
            > extension/scripts/live-snap.json
          test -s extension/scripts/live-snap.json

      - name: Assert self-review snapshot
        run: node scripts/verify-graphide.js --assert-snap

      # Fixture parent, not git HEAD^ — shallow Actions clones stay flake-free.
      - name: Architecture Delta fixture
        run: |
          set -euo pipefail
          ./target/debug/graphide review --root fixtures/demo --parent fixtures/demo-parent --json --progress \
            > extension/scripts/delta-snap.json
          test -s extension/scripts/delta-snap.json

      # Same control-flow / data-subscription slice as first_slice.rs.
      - name: Sequence fixture
        run: |
          set -euo pipefail
          ./target/debug/graphide review --root fixtures/demo --json --progress --no-parent \
            > extension/scripts/sequence-snap.json
          test -s extension/scripts/sequence-snap.json

      - name: Data-flow fixture
        run: |
          set -euo pipefail
          ./target/debug/graphide review --root fixtures/demo --json --progress --no-parent \
            > extension/scripts/dataflow-snap.json
          test -s extension/scripts/dataflow-snap.json

      - name: Lifecycle fixture
        run: |
          set -euo pipefail
          ./target/debug/graphide review --root fixtures/demo --json --progress --no-parent \
            > extension/scripts/lifecycle-snap.json
          test -s extension/scripts/lifecycle-snap.json

      - name: Static map gate
        run: node extension/scripts/check-map.js

      - name: Install verify toolchain
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Drive Review harness
        run: npm run verify

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: verification/
          if-no-files-found: error
