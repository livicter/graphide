[workspace]
resolver = "2"
members = [
    "crates/graphide-ir",
    "crates/graphide-engine",
    "crates/graphide-plugin-rust",
    "crates/graphide-plugin",
    "crates/graphide-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
graphide-ir = { path = "crates/graphide-ir" }
graphide-engine = { path = "crates/graphide-engine" }
graphide-plugin-rust = { path = "crates/graphide-plugin-rust" }
graphide-plugin = { path = "crates/graphide-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
indexmap = { version = "2", features = ["serde"] }
petgraph = "0.7"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
walkdir = "2"
rayon = "1"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-c = "0.24"
tree-sitter-go = "0.25"
